services:

  app:
    container_name: app
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SERVICE_NAME=example-otelgo-app
      - ENVIRONMENT=dev
      - OTEL_ENDPOINT=otel-collector:4317
    volumes:
      - .:/app
      - /app/tmp
      - ./.air.toml:/app/.air.toml
    depends_on:
#      - mongodb
#      - redis
      - otel-collector
    networks:
      - example_network

